backend:

  name: github

  repo: loliemartinez/-lolie-portfolio

  branch: main

  base_url: https://lolie-portfolio-oauth.lolie-martinezaubry.workers.dev

  auth_endpoint: auth
media_folder: "uploads"
public_folder: "/uploads"
locale: fr
publish: true
show_preview_links: true

site_url: "https://lolie-portfolio.netlify.app"
collections:
  - name: "site"
    label: "Pages et informations"
    files:
      - name: "general"
        label: "Accueil, contact, à propos et parcours"
        file: "content/site.json"
        format: json
        fields:
          - {label: "Introduction de la page d’accueil", name: home_intro, widget: text, required: true}
          - {label: "Texte de contact", name: contact_text, widget: text, required: true}
          - {label: "Texte du bouton de contact", name: contact_button, widget: text, required: true}
          - {label: "Petite note de contact", name: contact_note, widget: text, required: true}
          - {label: "Adresse e-mail", name: contact_email, widget: string, required: true}
          - {label: "Phrase d’introduction — À propos", name: about_lead, widget: text, required: true}
          - {label: "Présentation — paragraphe 1", name: about_story_1, widget: text, required: true}
          - {label: "Présentation — paragraphe 2", name: about_story_2, widget: text, required: true}
          - {label: "Présentation — paragraphe 3", name: about_story_3, widget: text, required: true}
          - {label: "Introduction du parcours", name: journey_intro, widget: text, required: true}
          - {label: "Introduction — personnalité", name: personality_intro, widget: text, required: true}
          - {label: "Centre d’intérêt 1 — titre", name: personality_1_title, widget: text, required: true}
          - {label: "Centre d’intérêt 1 — texte", name: personality_1_text, widget: text, required: true}
          - {label: "Centre d’intérêt 2 — titre", name: personality_2_title, widget: text, required: true}
          - {label: "Centre d’intérêt 2 — texte", name: personality_2_text, widget: text, required: true}
          - {label: "Centre d’intérêt 3 — titre", name: personality_3_title, widget: text, required: true}
          - {label: "Centre d’intérêt 3 — texte", name: personality_3_text, widget: text, required: true}
          - {label: "Centre d’intérêt 4 — titre", name: personality_4_title, widget: text, required: true}
          - {label: "Centre d’intérêt 4 — texte", name: personality_4_text, widget: text, required: true}
          - {label: "Étape 1 — date", name: timeline_1_date, widget: text, required: true}
          - {label: "Étape 1 — rubrique", name: timeline_1_label, widget: text, required: true}
          - {label: "Étape 1 — titre", name: timeline_1_title, widget: text, required: true}
          - {label: "Étape 1 — description", name: timeline_1_text, widget: text, required: true}
          - {label: "Étape 2 — date", name: timeline_2_date, widget: text, required: true}
          - {label: "Étape 2 — rubrique", name: timeline_2_label, widget: text, required: true}
          - {label: "Étape 2 — titre", name: timeline_2_title, widget: text, required: true}
          - {label: "Étape 2 — description", name: timeline_2_text, widget: text, required: true}
          - {label: "Étape 3 — date", name: timeline_3_date, widget: text, required: true}
          - {label: "Étape 3 — rubrique", name: timeline_3_label, widget: text, required: true}
          - {label: "Étape 3 — titre", name: timeline_3_title, widget: text, required: true}
          - {label: "Étape 3 — description", name: timeline_3_text, widget: text, required: true}
          - {label: "Étape 4 — date", name: timeline_4_date, widget: text, required: true}
          - {label: "Étape 4 — rubrique", name: timeline_4_label, widget: text, required: true}
          - {label: "Étape 4 — titre", name: timeline_4_title, widget: text, required: true}
          - {label: "Étape 4 — description", name: timeline_4_text, widget: text, required: true}
          - {label: "Étape 5 — date", name: timeline_5_date, widget: text, required: true}
          - {label: "Étape 5 — rubrique", name: timeline_5_label, widget: text, required: true}
          - {label: "Étape 5 — titre", name: timeline_5_title, widget: text, required: true}
          - {label: "Étape 5 — description", name: timeline_5_text, widget: text, required: true}
          - {label: "Étape 6 — date", name: timeline_6_date, widget: text, required: true}
          - {label: "Étape 6 — rubrique", name: timeline_6_label, widget: text, required: true}
          - {label: "Étape 6 — titre", name: timeline_6_title, widget: text, required: true}
          - {label: "Étape 6 — description", name: timeline_6_text, widget: text, required: true}
          - {label: "CV à télécharger", name: cv_file, widget: file, required: false}
  - name: "portfolio"
    label: "Contenus du portfolio"
    files:
      - name: "projects"
        label: "Projets"
        file: "content/projects.json"
        format: json
        fields:
          - label: "Projets (cliquer pour modifier)"
            name: "projects"
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: "{{fields.name}} — {{fields.category}}"
            fields:
              - {label: "Identifiant unique (sans espace)", name: id, widget: string, hint: "Exemple : nouveau-projet. Ne plus changer après publication."}
              - {label: "Nom", name: name, widget: string}
              - {label: "Catégorie (identifiant)", name: category, widget: select, options: [communication, image, editorial], hint: "Choisir une catégorie existante. Pour en ajouter une, modifier aussi les catégories."}
              - {label: "Type / secteur", name: type, widget: string}
              - {label: "Année", name: year, widget: string}
              - {label: "Titre accroche", name: headline, widget: string}
              - {label: "Missions — mots-clés", name: tags, widget: string}
              - {label: "Contexte et objectifs", name: context, widget: text}
              - {label: "Mon rôle et mes réalisations", name: role, widget: text}
              - {label: "Description du projet", name: description, widget: text, required: false, hint: "Présentation libre de la démarche et des réalisations."}
              - {label: "Résultats (facultatif)", name: results, widget: text, required: false, hint: "Laisser vide pour masquer entièrement cette section. Ne renseigner que des résultats vérifiables."}
              - {label: "Couverture (facultatif)", name: cover, widget: image, required: false}
              - {label: "Style de couverture (sans image)", name: art, widget: select, options: [art-connect, art-nyx, art-frette, art-wim, art-album, art-ris, art-options, art-fireclub, art-bavarde], default: art-connect}
              - {label: "Position dans la liste", name: order, widget: number, value_type: int, min: 1}
              - {label: "À la une sur l'accueil", name: featured, widget: boolean, default: false}
              - {label: "Afficher sur le site", name: published, widget: boolean, default: true}
              - label: "Blocs de réalisations (ordre libre)"
                name: blocks
                widget: list
                collapsed: true
                summary: "{{fields.kind}} — {{fields.caption}}"
                required: false
                hint: "Ajouter des blocs dans l’ordre souhaité : image, vidéo ou texte. Les anciens champs galerie restent compatibles."
                fields:
                  - {label: "Type", name: kind, widget: select, options: [image, video, text]}
                  - {label: "Disposition", name: layout, widget: select, options: [standard, wide, vertical], default: standard}
                  - {label: "Image", name: image, widget: image, required: false}
                  - {label: "URL vidéo (YouTube, Vimeo ou MP4)", name: url, widget: string, required: false}
                  - {label: "Texte", name: text, widget: text, required: false}
                  - {label: "Légende", name: caption, widget: string, required: false}
                  - {label: "Texte alternatif", name: alt, widget: string, required: false}
              - label: "Galerie de photos"
                name: images
                widget: list
                collapsed: true
                summary: "{{fields.caption}}"
                required: false
                fields:
                  - {label: "Photo", name: image, widget: image}
                  - {label: "Texte alternatif", name: alt, widget: string, required: false}
                  - {label: "Légende", name: caption, widget: string, required: false}
              - label: "Liens vidéos"
                name: videos
                widget: list
                collapsed: true
                summary: "{{fields.caption}}"
                required: false
                fields:
                  - {label: "Lien vers la vidéo", name: url, widget: string}
                  - {label: "Légende", name: caption, widget: string, required: false}
      - name: "categories"
        label: "Catégories"
        file: "content/categories.json"
        format: json
        fields:
          - label: "Catégories"
            name: categories
            widget: list
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - {label: "Identifiant (sans espace)", name: id, widget: string}
              - {label: "Nom affiché", name: name, widget: string}
              - {label: "Ordre", name: order, widget: number, value_type: int, min: 1}

  - name: "photography"
    label: "Galerie photographie"
    files:
      - name: "photos"
        label: "Photographies"
        file: "content/photos.json"
        format: json
        fields:
          - label: "Photographies (cliquer pour modifier)"
            name: photos
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - {label: "Image", name: image, widget: image}
              - {label: "Titre", name: title, widget: string}
              - {label: "Texte alternatif", name: alt, widget: string, required: false}
              - {label: "Lieu", name: location, widget: string, required: false}
              - {label: "Année", name: year, widget: string, required: false}
              - {label: "Catégories", name: categories, widget: select, multiple: true, options: [live, portraits, territoires, reportages]}
              - {label: "Visible", name: published, widget: boolean, default: true}
