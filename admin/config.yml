# À CONFIGURER AVANT CONNEXION : remplacer VOTRE_COMPTE/VOTRE_DEPOT.
# Le backend GitHub nécessite un accès authentifié (OAuth / fournisseur compatible).
backend:
  name: github
  repo: VOTRE_COMPTE/VOTRE_DEPOT
  branch: main
media_folder: "uploads"
public_folder: "/uploads"
locale: fr
publish: true
site_url: "https://VOTRE-SITE.netlify.app"
collections:
  - name: "site"
    label: "Pages et informations"
    files:
      - name: "general"
        label: "Accueil, contact, à propos et parcours"
        file: "content/site.json"
        format: json
        fields:
          - {label: "Home intro", name: home_intro, widget: text, required: true}
          - {label: "Contact text", name: contact_text, widget: text, required: true}
          - {label: "Contact button", name: contact_button, widget: text, required: true}
          - {label: "Contact note", name: contact_note, widget: text, required: true}
          - {label: "Contact email", name: contact_email, widget: string, required: true}
          - {label: "About lead", name: about_lead, widget: text, required: true}
          - {label: "About story 1", name: about_story_1, widget: text, required: true}
          - {label: "About story 2", name: about_story_2, widget: text, required: true}
          - {label: "About story 3", name: about_story_3, widget: text, required: true}
          - {label: "Journey intro", name: journey_intro, widget: text, required: true}
          - {label: "Personality intro", name: personality_intro, widget: text, required: true}
          - {label: "Personality 1 title", name: personality_1_title, widget: text, required: true}
          - {label: "Personality 1 text", name: personality_1_text, widget: text, required: true}
          - {label: "Personality 2 title", name: personality_2_title, widget: text, required: true}
          - {label: "Personality 2 text", name: personality_2_text, widget: text, required: true}
          - {label: "Personality 3 title", name: personality_3_title, widget: text, required: true}
          - {label: "Personality 3 text", name: personality_3_text, widget: text, required: true}
          - {label: "Personality 4 title", name: personality_4_title, widget: text, required: true}
          - {label: "Personality 4 text", name: personality_4_text, widget: text, required: true}
          - {label: "Timeline 1 date", name: timeline_1_date, widget: text, required: true}
          - {label: "Timeline 1 label", name: timeline_1_label, widget: text, required: true}
          - {label: "Timeline 1 title", name: timeline_1_title, widget: text, required: true}
          - {label: "Timeline 1 text", name: timeline_1_text, widget: text, required: true}
          - {label: "Timeline 2 date", name: timeline_2_date, widget: text, required: true}
          - {label: "Timeline 2 label", name: timeline_2_label, widget: text, required: true}
          - {label: "Timeline 2 title", name: timeline_2_title, widget: text, required: true}
          - {label: "Timeline 2 text", name: timeline_2_text, widget: text, required: true}
          - {label: "Timeline 3 date", name: timeline_3_date, widget: text, required: true}
          - {label: "Timeline 3 label", name: timeline_3_label, widget: text, required: true}
          - {label: "Timeline 3 title", name: timeline_3_title, widget: text, required: true}
          - {label: "Timeline 3 text", name: timeline_3_text, widget: text, required: true}
          - {label: "Timeline 4 date", name: timeline_4_date, widget: text, required: true}
          - {label: "Timeline 4 label", name: timeline_4_label, widget: text, required: true}
          - {label: "Timeline 4 title", name: timeline_4_title, widget: text, required: true}
          - {label: "Timeline 4 text", name: timeline_4_text, widget: text, required: true}
          - {label: "Timeline 5 date", name: timeline_5_date, widget: text, required: true}
          - {label: "Timeline 5 label", name: timeline_5_label, widget: text, required: true}
          - {label: "Timeline 5 title", name: timeline_5_title, widget: text, required: true}
          - {label: "Timeline 5 text", name: timeline_5_text, widget: text, required: true}
          - {label: "Timeline 6 date", name: timeline_6_date, widget: text, required: true}
          - {label: "Timeline 6 label", name: timeline_6_label, widget: text, required: true}
          - {label: "Timeline 6 title", name: timeline_6_title, widget: text, required: true}
          - {label: "Timeline 6 text", name: timeline_6_text, widget: text, required: true}
          - {label: "Cv file", name: cv_file, widget: file, required: false}
  - name: "portfolio"
    label: "Contenus du portfolio"
    files:
      - name: "projects"
        label: "Projets"
        file: "content/projects.json"
        format: json
        fields:
          - label: "Projets"
            name: "projects"
            widget: list
            summary: "{{fields.name}} — {{fields.category}}"
            fields:
              - {label: "Identifiant unique (sans espace)", name: id, widget: string, hint: "Exemple : nouveau-projet. Ne plus changer après publication."}
              - {label: "Nom", name: name, widget: string}
              - {label: "Catégorie (identifiant)", name: category, widget: string, hint: "Utiliser l'identifiant d'une catégorie existante."}
              - {label: "Type / secteur", name: type, widget: string}
              - {label: "Année", name: year, widget: string}
              - {label: "Titre accroche", name: headline, widget: string}
              - {label: "Missions (mots-clés)", name: tags, widget: string}
              - {label: "Contexte", name: context, widget: text}
              - {label: "Mon intervention", name: role, widget: text}
              - {label: "Description du projet", name: description, widget: text, required: false, hint: "Présentation libre de la démarche et des réalisations."}
              - {label: "Résultats (facultatif)", name: results, widget: text, required: false, hint: "Laisser vide pour masquer entièrement cette section. Ne renseigner que des résultats vérifiables."}
              - {label: "Couverture (facultatif)", name: cover, widget: image, required: false}
              - {label: "Style de couverture (sans image)", name: art, widget: select, options: [art-connect, art-nyx, art-frette, art-wim, art-album, art-ris, art-options, art-fireclub, art-bavarde], default: art-connect}
              - {label: "Ordre d'affichage", name: order, widget: number, value_type: int, min: 1}
              - {label: "À la une sur l'accueil", name: featured, widget: boolean, default: false}
              - {label: "Publié", name: published, widget: boolean, default: true}
              - label: "Blocs de réalisations (ordre libre)"
                name: blocks
                widget: list
                required: false
                hint: "Ajouter des blocs dans l’ordre souhaité : image, vidéo ou texte. Les anciens champs galerie restent compatibles."
                fields:
                  - {label: "Type", name: kind, widget: select, options: [image, video, text]}
                  - {label: "Disposition", name: layout, widget: select, options: [standard, wide, vertical], default: standard}
                  - {label: "Image", name: image, widget: image, required: false}
                  - {label: "URL vidéo (YouTube, Vimeo ou MP4)", name: url, widget: string, required: false}
                  - {label: "Texte", name: text, widget: text, required: false}
                  - {label: "Légende", name: caption, widget: string, required: false}
                  - {label: "Texte alternatif", name: alt, widget: string, required: false}
              - label: "Galerie de photos"
                name: images
                widget: list
                required: false
                fields:
                  - {label: "Photo", name: image, widget: image}
                  - {label: "Texte alternatif", name: alt, widget: string, required: false}
                  - {label: "Légende", name: caption, widget: string, required: false}
              - label: "Liens vidéos"
                name: videos
                widget: list
                required: false
                fields:
                  - {label: "Lien vers la vidéo", name: url, widget: string}
                  - {label: "Légende", name: caption, widget: string, required: false}
      - name: "categories"
        label: "Catégories"
        file: "content/categories.json"
        format: json
        fields:
          - label: "Catégories"
            name: categories
            widget: list
            summary: "{{fields.name}}"
            fields:
              - {label: "Identifiant (sans espace)", name: id, widget: string}
              - {label: "Nom affiché", name: name, widget: string}
              - {label: "Ordre", name: order, widget: number, value_type: int, min: 1}

  - name: "photography"
    label: "Galerie photographie"
    files:
      - name: "photos"
        label: "Photographies"
        file: "content/photos.json"
        format: json
        fields:
          - label: "Photographies"
            name: photos
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {label: "Image", name: image, widget: image}
              - {label: "Titre", name: title, widget: string}
              - {label: "Texte alternatif", name: alt, widget: string, required: false}
              - {label: "Lieu", name: location, widget: string, required: false}
              - {label: "Année", name: year, widget: string, required: false}
              - {label: "Catégories", name: categories, widget: select, multiple: true, options: [live, portraits, territoires, reportages]}
              - {label: "Visible", name: published, widget: boolean, default: true}
